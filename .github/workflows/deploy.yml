name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Find or create the D1 database
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="proofline");if(d)console.log(d.uuid)')
          if [ -z "$id" ]; then
            npx wrangler d1 create proofline
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));console.log(l.find(x=>x.name==="proofline").uuid)')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
      - run: npx wrangler d1 migrations apply proofline --remote
      - run: npx wrangler deploy
      - name: Set PayPal sandbox secrets
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_BUYER_EMAIL: ${{ secrets.PAYPAL_BUYER_EMAIL }}
          PAYPAL_MERCHANT_ID: ${{ secrets.PAYPAL_MERCHANT_ID }}
        run: |
          put() { if [ -n "$2" ]; then echo "$2" | npx wrangler secret put "$1"; fi; }
          if [ -z "$PAYPAL_CLIENT_SECRET" ]; then echo "No PayPal secrets set; the app runs on offline demo data."; exit 0; fi
          put PAYPAL_CLIENT_ID "$PAYPAL_CLIENT_ID"
          put PAYPAL_CLIENT_SECRET "$PAYPAL_CLIENT_SECRET"
          put PAYPAL_BUYER_EMAIL "$PAYPAL_BUYER_EMAIL"
          put PAYPAL_MERCHANT_ID "$PAYPAL_MERCHANT_ID"
