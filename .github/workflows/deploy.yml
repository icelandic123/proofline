name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Find or create the D1 database
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="proofline");if(d)console.log(d.uuid)')
          if [ -z "$id" ]; then
            npx wrangler d1 create proofline
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));console.log(l.find(x=>x.name==="proofline").uuid)')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
      - run: npx wrangler d1 migrations apply proofline --remote
      - run: npx wrangler deploy
      - name: Set PayPal sandbox secrets
        if: ${{ env.PAYPAL_CLIENT_SECRET != '' }}
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_BUYER_EMAIL: ${{ secrets.PAYPAL_BUYER_EMAIL }}
        run: |
          echo "$PAYPAL_CLIENT_ID" | npx wrangler secret put PAYPAL_CLIENT_ID
          echo "$PAYPAL_CLIENT_SECRET" | npx wrangler secret put PAYPAL_CLIENT_SECRET
          if [ -n "$PAYPAL_BUYER_EMAIL" ]; then echo "$PAYPAL_BUYER_EMAIL" | npx wrangler secret put PAYPAL_BUYER_EMAIL; fi
